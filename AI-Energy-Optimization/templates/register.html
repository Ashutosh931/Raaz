{% extends "base.html" %}

{% block title %}Register - AI Energy Optimizer{% endblock %}

{% block public_content %}
<div class="container my-auto">
  <div class="row justify-content-center">
    <div class="col-md-9 col-lg-6">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-dark text-white p-4 text-center border-0" style="background: linear-gradient(135deg, #0f172a, #1e293b) !important;">
          <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 24px;">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h4 class="fw-bold mb-1">Create an Account</h4>
          <p class="text-secondary small mb-0">Set up your AI smart energy optimization profile</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold small text-muted">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control bg-light border-start-0" id="name" name="name" value="{{ name or '' }}" placeholder="Ashutosh Yadav" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small text-muted">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="ashutosh@example.com" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label for="password" class="form-label fw-semibold small text-muted">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Min 6 chars" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="confirm_password" class="form-label fw-semibold small text-muted">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                  <input type="password" class="form-control bg-light border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                </div>
              </div>
            </div>

            <div class="row g-2 mb-4">
              <div class="col-md-6">
                <label for="currency" class="form-label fw-semibold small text-muted">Billing Currency</label>
                <select class="form-select bg-light" id="currency" name="currency">
                  <option value="₹" selected>₹ (Indian Rupee - INR)</option>
                  <option value="$">$ (US Dollar - USD)</option>
                  <option value="€">€ (Euro - EUR)</option>
                  <option value="£">£ (British Pound - GBP)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="tariff" class="form-label fw-semibold small text-muted">Tariff Rate (per kWh)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">Rate</span>
                  <input type="number" step="0.1" min="0.5" class="form-control bg-light border-start-0" id="tariff" name="tariff" value="8.0" required>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3 shadow-sm" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">
              <i class="bi bi-check2-circle me-1"></i> Register & Initialize Dashboard
            </button>
          </form>

          <div class="text-center pt-3 border-top">
            <span class="text-muted small">Already registered? </span>
            <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none small">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
