{% extends "base.html" %}

{% block title %}Sign In - AI Energy Optimizer{% endblock %}

{% block public_content %}
<div class="container my-auto">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-dark text-white p-4 text-center border-0" style="background: linear-gradient(135deg, #0f172a, #1e293b) !important;">
          <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 24px;">
            <i class="bi bi-lightning-charge-fill"></i>
          </div>
          <h4 class="fw-bold mb-1">Welcome Back</h4>
          <p class="text-secondary small mb-0">Sign in to your smart energy account</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small text-muted">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="student@college.edu" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between">
                <label for="password" class="form-label fw-semibold small text-muted">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3 shadow-sm" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>
          </form>

          <div class="text-center pt-3 border-top">
            <span class="text-muted small">Don't have an account? </span>
            <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none small">Create an Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
